name: GCP credit report

on:
  # 정기 실행은 Cloud Scheduler -> Cloud Run Job 이 담당한다 (README "Cloud Run Job 배포").
  # GitHub 의 schedule 은 무료 플랜 private 저장소에서 한 번도 발화하지 않았고,
  # 되살리면 Cloud Run 과 같은 시각이라 카드가 두 번 온다. 수동 실행 경로만 남긴다.
  #
  # schedule:
  #   - cron: "37 11,23 * * *"   # KST 08:37 / 20:37
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - run: python report.py
        env:
          BQ_BILLING_TABLE: ${{ vars.BQ_BILLING_TABLE }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TOTAL_CREDIT: ${{ vars.TOTAL_CREDIT }}
          CREDIT_EXPIRY: ${{ vars.CREDIT_EXPIRY }}
          CURRENCY: ${{ vars.CURRENCY }}
          PROJECT_LABEL: ${{ vars.PROJECT_LABEL }}
          MENTION_THRESHOLDS: ${{ vars.MENTION_THRESHOLDS }}
          MENTION_LOOKBACK_HOURS: "12"
          REPORT_TZ: Asia/Seoul

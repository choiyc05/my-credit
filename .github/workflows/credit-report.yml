name: GCP credit report

on:
  schedule:
    # KST 09:00 / 21:00 (UTC 00:00 / 12:00)
    - cron: "0 0,12 * * *"
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - run: python report.py
        env:
          BQ_BILLING_TABLE: ${{ vars.BQ_BILLING_TABLE }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TOTAL_CREDIT: ${{ vars.TOTAL_CREDIT }}
          CREDIT_EXPIRY: ${{ vars.CREDIT_EXPIRY }}
          CURRENCY: ${{ vars.CURRENCY }}
          PROJECT_LABEL: ${{ vars.PROJECT_LABEL }}
          MENTION_THRESHOLDS: ${{ vars.MENTION_THRESHOLDS }}
          MENTION_LOOKBACK_HOURS: "12"
          REPORT_TZ: Asia/Seoul
